spring.application.name=notes-backend

# Datasource (overridable via environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notesdb}
spring.datasource.username=${DB_USER:notes}
spring.datasource.password=${DB_PASSWORD:notes}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Force UTC when talking to the DB; avoids PostgreSQL 16 rejecting legacy TZ
# aliases like "America/Buenos_Aires" sent by the JVM.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Server
server.port=${SERVER_PORT:8080}

# CORS allowed origin (frontend dev server)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
